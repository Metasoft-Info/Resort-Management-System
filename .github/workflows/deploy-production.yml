name: Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          envs: APP_DIR,DEPLOY_BRANCH,PHP_BIN,COMPOSER_BIN
          script: |
            RESOLVED_APP_DIR="$APP_DIR"
            if [ ! -f "$RESOLVED_APP_DIR/artisan" ]; then
              if [ -f "$RESOLVED_APP_DIR/../artisan" ]; then
                RESOLVED_APP_DIR="$(cd "$RESOLVED_APP_DIR/.." && pwd)"
              elif [ -L "$RESOLVED_APP_DIR" ]; then
                LINK_TARGET="$(readlink -f "$RESOLVED_APP_DIR" || true)"
                if [ -n "$LINK_TARGET" ] && [ -f "$LINK_TARGET/../artisan" ]; then
                  RESOLVED_APP_DIR="$(cd "$LINK_TARGET/.." && pwd)"
                fi
              fi
            fi

            APP_DIR="$RESOLVED_APP_DIR"

            if [ ! -f "$APP_DIR/deploy/production_deploy.sh" ]; then
              cd "$APP_DIR"
              git fetch --all --prune
              git checkout "$DEPLOY_BRANCH" || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
              git reset --hard "origin/$DEPLOY_BRANCH"
            fi
            bash "$APP_DIR/deploy/production_deploy.sh"
        env:
          APP_DIR: ${{ secrets.PROD_APP_DIR }}
          DEPLOY_BRANCH: production
          PHP_BIN: ${{ secrets.PROD_PHP_BIN }}
          COMPOSER_BIN: ${{ secrets.PROD_COMPOSER_BIN }}
